<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>Hard Time 分層樣品驗收</title>
<style>body{margin:0;background:#17191c;color:#e5e1d8;font:16px system-ui}header{padding:18px 26px}h1{font-size:22px;margin:0 0 8px}p{margin:8px 0;color:#bbb}button,label{margin-right:16px}button{padding:8px 16px;background:#cbb18a;border:0;border-radius:5px}main{display:flex;gap:20px;padding:0 26px}section{flex:1;text-align:center}canvas{width:auto;max-width:100%;height:73vh;background:repeating-conic-gradient(#292c31 0% 25%,#34373c 0% 50%) 0/24px 24px}strong{color:#e9bc70}</style>
<header><h1>Hard Time · 分層樣品 v1</h1><strong>待修正，尚未通過交件驗收</strong><p>左：姿勢底稿。右：四層組裝與肩部旋轉測試。頭與袖口的生成差異仍需修圖；本頁不是正式遊戲骨架。</p><button id="play">播放肩部測試</button><label>肩角度 <input id="angle" type="range" min="-12" max="12" step="0.1" value="0"> <output id="value">0°</output></label><label><input id="body" type="checkbox" checked>顯示軀幹</label><label><input id="guides" type="checkbox" checked>肩支點</label><p id="status">正在載入…</p></header>
<main><section>姿勢底稿<br><canvas id="master" width="1024" height="2048"></canvas></section><section>組裝樣品<br><canvas id="layers" width="1024" height="2048"></canvas></section></main>
<script>
const $=id=>document.getElementById(id), images={};
const config={body:{file:'body_v2_generated.png',scale:1,x:0,y:0},head:{file:'head_generated.png',scale:.285,x:318,y:70},arm_r:{file:'arm_r_generated.png',scale:.556,x:69,y:182,pivot:[277,422],elbow:[212,655],bounds:[110,320,470,1510]},arm_l:{file:'arm_l_generated.png',scale:.65,x:237,y:57,pivot:[622,422],elbow:[679,655],bounds:[520,505,790,1480]}};
let playing=false,start=0;
function base(ctx){ctx.clearRect(0,0,1024,2048);ctx.save();ctx.translate(79,53);ctx.scale(1.029,1.029)}
function warp(c,u,v,bend){let x=c.x+u*c.scale,y=c.y+v*c.scale;let w=Math.max(0,Math.min(1,(y-570)/170));w=w*w*(3-2*w);const a=bend*w*Math.PI/180,dx=x-c.elbow[0],dy=y-c.elbow[1];return [c.elbow[0]+dx*Math.cos(a)-dy*Math.sin(a),c.elbow[1]+dx*Math.sin(a)+dy*Math.cos(a)]}
function det(a,b,c){return (b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0])}
function triangle(ctx,img,s,d){const den=det(...s),a=((d[1][0]-d[0][0])*(s[2][1]-s[0][1])-(d[2][0]-d[0][0])*(s[1][1]-s[0][1]))/den,b=((d[1][1]-d[0][1])*(s[2][1]-s[0][1])-(d[2][1]-d[0][1])*(s[1][1]-s[0][1]))/den,c=((s[1][0]-s[0][0])*(d[2][0]-d[0][0])-(s[2][0]-s[0][0])*(d[1][0]-d[0][0]))/den,e=((s[1][0]-s[0][0])*(d[2][1]-d[0][1])-(s[2][0]-s[0][0])*(d[1][1]-d[0][1]))/den;ctx.save();ctx.beginPath();ctx.moveTo(...d[0]);ctx.lineTo(...d[1]);ctx.lineTo(...d[2]);ctx.closePath();ctx.clip();ctx.transform(a,b,c,e,d[0][0]-a*s[0][0]-c*s[0][1],d[0][1]-b*s[0][0]-e*s[0][1]);ctx.drawImage(img,0,0);ctx.restore();return det(...d)/(den)}
function mesh(ctx,key,bend){const c=config[key],[x0,y0,x1,y1]=c.bounds;let min=Infinity;for(let j=0;j<24;j++)for(let i=0;i<6;i++){const u=x0+(x1-x0)*i/6,v=y0+(y1-y0)*j/24,du=(x1-x0)/6,dv=(y1-y0)/24;for(const s of [[[u,v],[u+du,v],[u,v+dv]],[[u+du,v],[u+du,v+dv],[u,v+dv]]]){const d=s.map(p=>warp(c,...p,bend));min=Math.min(min,triangle(ctx,images[key],s,d)/(c.scale*c.scale))}}return min}
function part(ctx,key,angle=0){const c=config[key];ctx.save();if(c.pivot){ctx.translate(...c.pivot);ctx.rotate(angle*Math.PI/180);ctx.translate(-c.pivot[0],-c.pivot[1]);mesh(ctx,key,angle*1.3)}else{ctx.translate(c.x,c.y);ctx.scale(c.scale,c.scale);ctx.drawImage(images[key],0,0)}ctx.restore()}
function render(angle){const ctx=$('layers').getContext('2d');base(ctx);part(ctx,'head');part(ctx,'arm_r',angle);part(ctx,'arm_l',-angle);if($('body').checked)part(ctx,'body');if($('guides').checked){ctx.fillStyle='#f6b950';for(const k of ['arm_r','arm_l']){ctx.beginPath();ctx.arc(...config[k].pivot,7,0,Math.PI*2);ctx.fill()}}ctx.restore();$('value').value=Number(angle).toFixed(1)+'°'}
async function init(){for(const [k,c] of Object.entries({...config,master:{file:'master_generated.png'}})){const i=new Image();i.src=c.file;await i.decode();images[k]=i}const c=$('master').getContext('2d');base(c);c.drawImage(images.master,0,0);c.restore();render(0);let min=Infinity;for(const key of ['arm_l','arm_r']){const cfg=config[key],[x0,y0,x1,y1]=cfg.bounds;for(let a=-15.6;a<=15.61;a+=.3)for(let j=0;j<24;j++)for(let i=0;i<6;i++){const u=x0+(x1-x0)*i/6,v=y0+(y1-y0)*j/24,du=(x1-x0)/6,dv=(y1-y0)/24;for(const s of [[[u,v],[u+du,v],[u,v+dv]],[[u+du,v],[u+du,v+dv],[u,v+dv]]])min=Math.min(min,det(...s.map(p=>warp(cfg,...p,a)))/(det(...s)*cfg.scale*cfg.scale));}}$('status').textContent='肩 ±12°／肘 ±15.6°，測試網格最小面積比 '+min.toFixed(3)+'（>0 無翻面）。尚未通過正式動作、圖層對位與交件驗收。';window.sampleReady=true;}
$('angle').oninput=()=>{playing=false;$('play').textContent='播放肩部測試';render(+$('angle').value)};for(const id of ['body','guides'])$(id).onchange=()=>render(+$('angle').value);
$('play').onclick=()=>{playing=!playing;start=performance.now();$('play').textContent=playing?'暫停':'播放肩部測試'};
function tick(t){if(playing){const angle=8*Math.sin((t-start)/1000*Math.PI);$('angle').value=angle;render(angle)}requestAnimationFrame(tick)}init().catch(e=>$('status').textContent='載入失敗：'+e.message);requestAnimationFrame(tick);
</script></html>
