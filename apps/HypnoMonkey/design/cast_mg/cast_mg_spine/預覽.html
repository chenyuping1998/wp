<style>
:root{--bg:#14161b;--panel:#1c1f26;--ink:#e7e9ee;--muted:#8b93a1;--rule:#2c313b;--accent:#f0565d;--bone:#cfd5df;--trail:#4ea1ff;--ghost:#ffffff}

let last = performance.now();
