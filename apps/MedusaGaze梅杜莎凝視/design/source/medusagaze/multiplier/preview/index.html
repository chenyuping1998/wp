<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梅杜莎 · 倍率招牌演出</title><style>@font-face{font-family:'Titan One';src:url('../../../../../static/fonts/TitanOne.ttf')}body{margin:0;background:#0a222c;color:#eee8d9;font:16px system-ui}main{max-width:1280px;margin:auto;padding:20px}h1{color:#f2c653;font-size:27px}canvas{display:block;width:100%;height:auto;border-radius:10px}button,select{font:inherit;padding:10px;background:#214752;color:#ffe8ae;border:1px solid #9b854d;border-radius:6px;margin:8px 6px 8px 0}input[type=range]{width:100%}p{line-height:1.7}#status{color:#f2c653}</style><main><h1>倍率招牌演出 · 低倍至神威漸層</h1><canvas id="stage" width="1280" height="720"></canvas><select id="case" aria-label="倍率情境"></select><button id="play">播放完整演出</button><button id="pause">暫停／繼續</button><label><input id="sound" type="checkbox"> 聲音</label><label>逐格檢視<input id="time" type="range" min="0" max="6.5" step="0.001" value="0"></label><p id="status">載入正式骨架與特效…</p><p>一般／TURBO 1／TURBO 2 的角色、光芒、倍率球與跳數速度相同。固定鏡頭。此頁共用遊戲的 Spine 4.3、寶珠原畫、飛行曲線與特效渲染；金額為審片示例。收肘回拉蓄力、短停後甩腕放出、聚球回拉壓縮、掌心釋放光環、帶動量出手、隨倍率增強的交纏尾流、金色光冠、希臘刻紋與分層命中波。聲音隨倍率平順混合晶石與重擊，蓄力、出手爆點與風壓保持同步；新增收肘、甩腕、金飾、甩尾與蛇咬細節音效，人物發聲跟隨骨架關鍵影格。勾選聲音後播放。無影片錄製。</p></main><script type="module" src="./scene.js?v=2f1d49edd7fb"></script></html>
