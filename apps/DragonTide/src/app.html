<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<!--
			Self-hosted circus wood type, so there is no third-party font request to fail.
			Rye (titles) is SIL Open Font Licence (static/fonts/Rye-OFL.txt); Ultra
			(numbers) is Apache 2.0 (static/fonts/Ultra-LICENSE.txt). Both permit
			commercial use and embedding. See game/fonts.ts for which face goes where.

			Preloaded because Pixi measures glyphs when it builds a Text, and a face
			that arrives late leaves the first frame laid out for the fallback metrics.
			game/fonts.ts additionally blocks startup on document.fonts.
		-->
		<link rel="preload" href="%sveltekit.assets%/fonts/Rye.ttf" as="font" type="font/ttf" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/Ultra.ttf" as="font" type="font/ttf" crossorigin />
		<!-- the bet bar's face (components/ui/MummyBar, bar v3): Nunito, OFL, a
		     variable 200..1000 weight file — see static/fonts/Nunito-OFL.txt -->
		<link rel="preload" href="%sveltekit.assets%/fonts/Nunito.ttf" as="font" type="font/ttf" crossorigin />
		<style>
			@font-face {
				font-family: 'Nunito';
				src: url('%sveltekit.assets%/fonts/Nunito.ttf') format('truetype');
				font-weight: 200 1000;
				font-style: normal;
				font-display: block;
			}
			@font-face {
				font-family: 'Rye';
				src: url('%sveltekit.assets%/fonts/Rye.ttf') format('truetype');
				font-weight: 400;
				font-style: normal;
				font-display: block;
			}
			@font-face {
				font-family: 'Ultra';
				src: url('%sveltekit.assets%/fonts/Ultra.ttf') format('truetype');
				font-weight: 400;
				font-style: normal;
				font-display: block;
			}
		</style>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		%sveltekit.head%
	</head>
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
		<div>%sveltekit.body%</div>
	</body>
</html>
