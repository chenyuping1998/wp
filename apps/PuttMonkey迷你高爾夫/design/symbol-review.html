<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Putt Monkey · 獎圖動態檢視</title>
<style>
  * { box-sizing: border-box; } body { margin: 0; padding: 32px; background: #203c30; color: #f7efd6; font: 15px/1.6 system-ui,sans-serif; }
  main { max-width: 1100px; margin: auto; } h1 { margin: 4px 0; font-size: clamp(25px,4vw,40px); } p { margin: 0 0 20px; color: #d3ddbc; }
  .eyebrow { color: #e1bc61; letter-spacing: .2em; font-size: 12px; } .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 16px 0; }
  button, select { font: inherit; border: 1px solid #c8d0a8; background: #f7efd6; color: #203c30; border-radius: 6px; padding: 8px 16px; cursor: pointer; } input { flex: 1; min-width: 140px; accent-color: #e1bc61; }
  #symbols { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 16px; } article { min-width: 0; text-align: center; padding: 12px; border: 1px solid #82977b; border-radius: 10px; background: #294b3a; }
  article canvas { width: 100%; height: auto; display: block; } h2 { margin: 0; font-size: 17px; } article p { margin: 0; font-size: 12px; } #status { font-variant-numeric: tabular-nums; }
  @media(max-width:650px) { body { padding: 16px; } #symbols { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; } }
</style>
<main>
  <div class="eyebrow">PUTT MONKEY / MOTION REVIEW</div>
  <h1>每一張獎圖，都有自己的動作</h1>
  <p>直接播放遊戲使用的網格與動畫，可暫停、逐格拖曳及檢視加速表現。</p>
  <div class="controls"><button id="play">暫停</button><label>速度 <select id="speed"><option value="1">正常</option><option value="0.5">0.5× 慢動作</option><option value="2">2× 加速</option></select></label><input id="time" aria-label="動畫時間" type="range" min="0" max="1440" value="0" /><span id="status">0 ms</span></div>
  <div id="symbols"></div>
  <h2 style="margin-top:32px">Game info · 新版圖文導覽</h2>
  <div id="guide" style="max-width:520px;margin:20px auto"></div>
</main>
<script type="module" src="./symbolReview.ts"></script>
</html>
